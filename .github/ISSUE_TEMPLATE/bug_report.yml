name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** post security problems here - see SECURITY.md.
        Power data reveals a lot about a household: remove anything you don't want to share from logs.
  - type: input
    id: version
    attributes:
      label: Shadow Meter version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run it?
      options:
        - Home Assistant app
        - Standalone container
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The app log (Settings → Apps → Shadow Meter → Log), set log_level to debug if possible.
      render: text
