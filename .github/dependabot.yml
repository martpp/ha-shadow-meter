version: 2
updates:
  - package-ecosystem: pip
    directory: /shadow_meter/engine
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /shadow_meter
      - /shadow_meter/engine
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
